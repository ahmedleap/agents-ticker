version: '3.8'

services:
  ticker-service:
    build: .
    image: ticker-service:0.4.4
    container_name: ticker-service
    ports:
      - "8000:8000"
    environment:
      # Database Configuration (update with your actual values)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Alpaca API Configuration
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}

      # Service Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      TRACKED_SYMBOLS: ${TRACKED_SYMBOLS:-AAPL,MSFT,GOOGL,AMZN,TSLA,SPY,QQQ,BND,JNJ,JPM}
      FOREX_ENABLED: ${FOREX_ENABLED:-true}
      FOREX_CURRENCIES: ${FOREX_CURRENCIES:-USD,CAD,EUR,JPY,CNY}
      FOREX_OFFSET_SECOND: ${FOREX_OFFSET_SECOND:-3}
      FRANKFURTER_URL: ${FRANKFURTER_URL:-https://api.frankfurter.dev/v2/rates}
      CRYPTO_ENABLED: ${CRYPTO_ENABLED:-true}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-BTC,ETH,SOL,XRP,USDT,USDC}
      CRYPTO_OFFSET_SECOND: ${CRYPTO_OFFSET_SECOND:-8}
      ALPACA_CRYPTO_FEED: ${ALPACA_CRYPTO_FEED:-}
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
